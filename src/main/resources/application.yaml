spring:
  application:
    name: bonus-generator

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  api:
    url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    key: ${AI_API_KEY}
    model: ${AI_MODEL:gemini-2.0-flash}

jobs:
  commit-analysis:
    cron: ${COMMIT_ANALYSIS_CRON:0 0 8 * * MON}
    zone: ${COMMIT_ANALYSIS_ZONE:America/Mexico_City}

server:
  port: ${PORT:8084}
