spring:
  application:
    name: bonus-generator

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:bonus-generator}
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.truper.bonusgenerator.infrastructure.kafka.event
    listener:
      ack-mode: record

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
      debug: ${MAIL_DEBUG:false}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:600000}
      keepalive-time: ${DB_KEEPALIVE_TIME:300000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

ai:
  api:
    url: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    key: ${AI_API_KEY}
    model: ${AI_MODEL:gemini-2.5-flash}
    fallback-model: ${AI_FALLBACK_MODEL:gemini-2.5-flash-lite}

jobs:
  commit-analysis:
    cron: ${COMMIT_ANALYSIS_CRON:0 15 7 * * MON}
    zone: ${COMMIT_ANALYSIS_ZONE:America/Mexico_City}

security:
  basic:
    username: ${SECURITY_USERNAME:dagonzalezm}
    password: ${SECURITY_PASSWORD:admin123}

mail:
  from: ${MAIL_FROM}
  to: ${MAIL_TO}

app:
  kafka:
    topics:
      commit-analysis-requested: ${KAFKA_TOPIC_COMMIT_ANALYSIS_REQUESTED:bonus.commit-analysis.requested}

server:
  port: ${PORT:8084}
